name: Stáhnout fotky z Wikimedia Commons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - foto/queries.json
      - scripts/fetch_photos.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout fotky
        run: python3 scripts/fetch_photos.py
      - name: Uložit do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add foto
          git diff --cached --quiet && echo "Beze změn" && exit 0
          git commit -m "Fotky: aktualizace databáze z Wikimedia Commons"
          git push
